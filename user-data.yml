#cloud-config https://canonical-subiquity.readthedocs-hosted.com/en/latest/reference/autoinstall-reference.html#user-data
autoinstall:
  version: 1
  source:
    search_drivers: false
#    id: <the installation source marked as default in install-sources.yaml>
  interactive-sections: [ ]
#    - network
#    - storage
  early-commands:
    # workaround to stop ssh for packer as it thinks it timed out
    - sudo systemctl stop ssh
    - sudo systemctl stop apt-daily.service
    - sudo systemctl stop apt-daily.timer
  locale: en_US.UTF-8
  keyboard:
    layout: us
  timezone: Asia/Shanghai
#  identity:
#    realname: develop
#    hostname: develop
#    username: develop
#    password: $6$lhvYUcShV/ezsNzr$DWnXMVnSnHXjPvegP0bNgnBJ8IcxlfkGxPgQX3ziAZ9nNZ.b8k2cB50.z7Ftrbm7QfoQaVrU5JxsUEPMSAfTa1

  # use-data for late-commands
  user-data:
    users:
      - name: develop
        gecos: develop
        groups: users, admin, adm, cdrom, sudo, dip, plugdev, docker
        shell: /bin/bash
        lock-passwd: false
        #mkpasswd --method=sha-512 develop
        passwd: "$6$OX9Cy7o6egZN9.5s$W7pzL55Px73ssJfqgYu69u7g2QUFESR7ciCOTU.Cu.93rp197P1A9yHMBmP.RASyl5KOxdrZvdFNOPRosLqKy0"
        sudo: "ALL=(ALL) NOPASSWD:ALL"
    disable_root: true
  network:
   version: 2
   ethernets:
     enp0s0:
       dhcp4: false
       addresses:
         - 192.168.2.100/24
       routes:
         - to: default
           via: 192.168.2.1
       nameservers:
         addresses:
           - 223.5.5.5
     enp0s1:
       dhcp4: false
       addresses:
         - 192.168.2.101/24
       routes:
         - to: default
           via: 192.168.2.1
       nameservers:
         addresses:
           - 223.5.5.5
     enp0s2:
       dhcp4: false
       addresses:
         - 192.168.2.102/24
       routes:
         - to: default
           via: 192.168.2.1
       nameservers:
         addresses:
           - 223.5.5.5
     enp0s3:
       dhcp4: false
       addresses:
         - 192.168.2.103/24
       routes:
         - to: default
           via: 192.168.2.1
       nameservers:
         addresses:
           - 223.5.5.5
     enp0s4:
       dhcp4: false
       addresses:
         - 192.168.2.104/24
       routes:
         - to: default
           via: 192.168.2.1
       nameservers:
         addresses:
           - 223.5.5.5
     enp1s0:
       dhcp4: false
       addresses:
         - 192.168.2.105/24
       routes:
         - to: default
           via: 192.168.2.1
       nameservers:
         addresses:
           - 223.5.5.5
     enp1s1:
       dhcp4: false
       addresses:
         - 192.168.2.106/24
       routes:
         - to: default
           via: 192.168.2.1
       nameservers:
         addresses:
           - 223.5.5.5
     enp1s2:
       dhcp4: false
       addresses:
         - 192.168.2.107/24
       routes:
         - to: default
           via: 192.168.2.1
       nameservers:
         addresses:
           - 223.5.5.5
     enp1s3:
       dhcp4: false
       addresses:
         - 192.168.2.108/24
       routes:
         - to: default
           via: 192.168.2.1
       nameservers:
         addresses:
           - 223.5.5.5
     enp1s4:
       dhcp4: false
       addresses:
         - 192.168.2.109/24
       routes:
         - to: default
           via: 192.168.2.1
       nameservers:
         addresses:
           - 223.5.5.5
  storage:
    layout:
      name: direct
    config:
      # 系统盘（必需）
      - type: disk
        id: disk-sda
        path: /dev/sda
        ptable: gpt
        wipe: superblock
        grub_device: true
        preserve: false
        partitions:
          # EFI 分区
          - type: partition
            id: efi-partition
            size: 512M
            number: 1
            flag: boot  # 仅标记 boot 标志即可
            guid: C12A7328-F81F-11D2-BA4B-00A0C93EC93B
          - type: format
            id: efi-format
            fstype: fat32
            label: ESP
          - type: mount
            path: /boot/efi

          # 根分区
          - type: partition
            id: root-partition
            number: 2
            size: -1  # 占用剩余空间
          - type: format
            id: root-format
            fstype: ext4
            extra_args: ["-O", "metadata_csum,64bit"]  # 启用校验和 64 位支持
            label: ubuntu-root
          - type: mount
            path: /

      - type: disk
        id: disk-sdb
        path: /dev/sdb
        ptable: gpt
        wipe: superblock
        preserve: false
        optional: true
        partitions:
          - type: partition
            id: data-part-1
            size: -1
            optional: true
          - type: format
            id: data-format-1
            fstype: xfs
            label: DATA_1
            extra_args: ["-m", "crc=1,finobt=1"]  # 启用 CRC 和反向索引
            optional: true
          - type: mount
            id: data-mount-1
            path: /data
            optional: true

      - type: disk
        id: disk-sdc
        path: /dev/sdc
        ptable: gpt
        wipe: superblock
        preserve: false
        optional: true
        partitions:
          - type: partition
            id: data-part-2
            size: -1
            optional: true
          - type: format
            id: data-format-2
            fstype: xfs
            label: DATA_2
            extra_args: ["-m", "crc=1,finobt=1"]  # 启用 CRC 和反向索引
            optional: true
          - type: mount
            id: data-mount-2
            path: /data1
            optional: true
           
  system:
    hardware:
      drivers: [ ]  # 跳过驱动安装
  refresh-installer:
    update: false
  apt:
    disable: true
    primary:
      - arches: [default]
        uri: https://mirrors.tuna.tsinghua.edu.cn/ubuntu
    disable_suites: [security]
    preserve_sources_list: false
    fallback: offline-install
    geoip: false
  updates: security
  package_upgrade: false
  drivers:
    install: false
  oem-config:
    disable: true
  oem:
    install: false
  codecs:
    install: false
  ssh:
    install-server: yes
    allow-pw: true
    ssh_quiet_keygen: false
  # Disable SSH root login and start the ufw firewall automatically
  debconf-selections: |
    etckeeper etckeeper/purge boolean true
    ufw ufw/enable boolean true
    openssh-server openssh-server/permit-root-login boolean false
    openssh-server openssh-server/port string 5022
  late-commands:
    - echo "sshd:ALL" >> /target/etc/hosts.deny
    - echo "sshd:127.0.0.1:allow" >> /target/etc/hosts.allow
    - sed -i -E 's/^#Port 22$/Port 5022/' /target/etc/ssh/sshd_config
    - sed -i -E 's/^#\s+Port 22$/    Port 5022/' /target/etc/ssh/ssh_config
    - sed -i -E 's/#(PermitRootLogin)(.*)/\1 no/' /target/etc/ssh/ssh_config
    - curtin in-target --target /target -- systemctl restart ssh
    - curtin in-target --target /target -- ufw enable
    - curtin in-target --target /target -- ufw allow 5022/tcp
    - curtin in-target --target /target -- systemctl disable systemd-networkd-wait-online.service
    - curtin in-target --target /target -- systemctl mask systemd-networkd-wait-online.service
    - sed -i -E 's/(.*)pam_cracklib.so(.*)$/\1pam_cracklib.so retry=5 minlen=12 difok=3 ucredit=-1 lcredit=-1 dcredit=-1 ocredit=-1  /' /target/etc/pam.d/common-password || true
#    - echo 'network: { config: disabled }' > /target/etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
#    - echo "network:{config:disabled}" > /target/etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
#    - sed -i -E 's|(network:)|\1 |g' /target/etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
#    - sed -i -E 's|(.*config:)|\1 |g' /target/etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
    - chroot /target systemctl enable disable-cloudinit-network.path
    - |
      chroot /target /bin/bash -c "
        groupadd -f docker
        if id develop >/dev/null 2>&1; then
          usermod -aG docker develop
          echo 'User develop added to docker group'
        else
          echo 'User develop does not exist'
        fi
      "
    - |
      if lspci -nn | grep -q '\[03..\]:.*NVIDIA'; then
        echo "NVIDIA GPU detected, searching for driver..."
        # Find NVIDIA driver files in /cdrom/drivers/
        DRIVER_FILE=$(find /cdrom/drivers/ -name "NVIDIA-Linux-x86_64-*.run" | head -n 1)
        if [ -n "$DRIVER_FILE" ] && [ -f "$DRIVER_FILE" ]; then
          echo "Driver found: $DRIVER_FILE"
          # Copy to target system
          cp "$DRIVER_FILE" /target/tmp/
          # Install driver
          chmod +x "/target/tmp/$(basename "$DRIVER_FILE")"
          curtin in-target --target /target -- "/tmp/$(basename "$DRIVER_FILE")" \
            --silent \
            --no-nouveau-check \
            --no-questions \
            --dkms \
            --no-backup || true
        else
          echo "No NVIDIA driver file found, skipping installation."
        fi
      else
        echo "No NVIDIA GPU detected, skipping driver installation."
      fi
